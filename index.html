<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legrand Wiring Devices Spec Lookup</title>
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Legrand Wiring Devices Spec Lookup</h1>
  <div class="searchwrap">
    <input id="search" type="search" inputmode="search" autocomplete="off"
           placeholder="Search catalog #, description, keyword..." />
  </div>
  <div id="brandChips" class="chips"></div>
  <div id="categoryChips" class="chips chips-secondary"></div>
</header>

<main id="results" class="results"></main>

<div id="detail" class="detail hidden">
  <div class="detail-inner">
    <button id="closeDetail" class="close-btn" aria-label="Close">&times;</button>
    <div id="detailBody"></div>
  </div>
</div>

<footer class="statusbar">
  <span id="status">Loading data…</span>
</footer>

<script src="app.js"></script>
</body>
</html>
